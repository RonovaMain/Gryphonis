name: Build Gryphonis APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Секрет "Gryphonis" = ваш .jks файл в base64.
      # Если секрета нет (например, PR из форка), APK всё равно соберётся — с debug-подписью.
      - name: Prepare release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.Gryphonis }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gryphonis.jks"
            echo "GRYPHONIS_KEYSTORE_PATH=$RUNNER_TEMP/gryphonis.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret 'Gryphonis' is empty or missing - the APK will be signed with the debug key."
          fi

      - name: Build release APK
        env:
          GRYPHONIS_KEYSTORE_PASSWORD: ${{ secrets.GRYPHONIS_KEYSTORE_PASSWORD }}
          GRYPHONIS_KEY_ALIAS: ${{ secrets.GRYPHONIS_KEY_ALIAS }}
          GRYPHONIS_KEY_PASSWORD: ${{ secrets.GRYPHONIS_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease -PversionCode=${{ github.run_number }} --stacktrace \
            || gradle :app:assembleRelease -PversionCode=${{ github.run_number }} -PdisableMinify=true --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Gryphonis-${{ github.run_number }}.apk"
          ls -la dist

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs dist/*.apk || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gryphonis-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
